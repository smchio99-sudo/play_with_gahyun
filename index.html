<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>가현이랑 놀자~</title>
  <style>
    :root {
      --ink: #4a3a4f;
      --ink-soft: #8a7a90;
      --paper: #fff5f8;
      --accent: #ff8fb1;
      --accent-2: #ffd76e;
      --mint: #9be3c8;
      --sky: #b5d8ff;
      --lavender: #d4c5f9;
      --peach: #ffd0b3;
      --line: rgba(74, 58, 79, 0.14);
      --shadow: 0 18px 45px rgba(255, 143, 177, 0.22);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 20%, rgba(255, 209, 230, 0.7), transparent 35%),
        radial-gradient(circle at 85% 15%, rgba(181, 216, 255, 0.6), transparent 32%),
        radial-gradient(circle at 75% 85%, rgba(212, 197, 249, 0.5), transparent 30%),
        radial-gradient(circle at 25% 80%, rgba(255, 215, 110, 0.35), transparent 28%),
        linear-gradient(135deg, #fff5f8 0%, #ffe9f1 40%, #f0e7ff 75%, #e6f3ff 100%);
      overflow: hidden;
    }

    button {
      font: inherit;
      color: inherit;
      border: 0;
      cursor: pointer;
    }

    .app {
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      padding: 12px clamp(16px, 3vw, 34px);
      background: transparent;
      border-bottom: 0;
      position: absolute;
      inset: 0 0 auto 0;
      z-index: 5;
      pointer-events: none;
    }

    .brand {
      display: none;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4.6vw, 52px);
      line-height: 1;
      letter-spacing: 0;
      color: #d62f24;
      text-shadow: 0 3px 0 rgba(255, 191, 47, 0.45);
      white-space: nowrap;
    }

    .brand span {
      font-weight: 800;
      font-size: 14px;
      color: rgba(37, 27, 24, 0.62);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
      pointer-events: auto;
    }

    .icon-button,
    .primary-button,
    .ghost-button {
      height: 42px;
      border-radius: 999px;
      border: 2px solid #fff;
      background: rgba(255, 255, 255, 0.85);
      color: var(--ink);
      box-shadow: 0 6px 14px rgba(255, 143, 177, 0.2);
      transition: transform 160ms cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 160ms ease, background 160ms ease;
      backdrop-filter: blur(8px);
    }

    .icon-button {
      width: 42px;
      display: grid;
      place-items: center;
      font-size: 22px;
    }

    .primary-button,
    .ghost-button {
      padding: 0 18px;
      font-weight: 900;
    }

    .primary-button {
      color: #fff;
      background: linear-gradient(135deg, var(--accent), #ffa3c1);
      border-color: #fff;
    }

    .ghost-button:hover,
    .icon-button:hover,
    .primary-button:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 10px 22px rgba(255, 143, 177, 0.3);
    }

    .screen {
      display: none;
      min-height: 0;
      position: relative;
    }

    .screen.active {
      display: block;
    }

    .menu {
      height: 100%;
      padding: clamp(140px, 22vh, 220px) clamp(18px, 4vw, 44px) clamp(18px, 4vw, 44px);
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: clamp(16px, 3vw, 30px);
      align-items: stretch;
      position: relative;
    }

    /* 떠다니는 장식 — 배경에 말랑한 도형들 */
    .menu::before,
    .menu::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .menu::before {
      width: 180px;
      height: 180px;
      top: 8%;
      left: 4%;
      background: radial-gradient(circle, rgba(255, 215, 110, 0.4), rgba(255, 215, 110, 0));
      animation: float-slow 7s ease-in-out infinite;
    }

    .menu::after {
      width: 220px;
      height: 220px;
      bottom: 18%;
      right: 3%;
      background: radial-gradient(circle, rgba(212, 197, 249, 0.45), rgba(212, 197, 249, 0));
      animation: float-slow 9s ease-in-out infinite reverse;
    }

    @keyframes float-slow {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(8deg); }
    }

    .menu-title-wrap {
      position: absolute;
      left: 50%;
      top: clamp(28px, 6vh, 60px);
      transform: translateX(-50%);
      z-index: 3;
      width: min(760px, calc(100% - 32px));
      text-align: center;
      pointer-events: none;
    }

    .menu-title {
      margin: 0;
      font-size: clamp(48px, 9vw, 108px);
      line-height: 0.95;
      letter-spacing: -2px;
      font-weight: 900;
      color: #fff;
      -webkit-text-stroke: 3px #ff8fb1;
      text-shadow:
        0 4px 0 #ffb8d0,
        0 8px 0 #ffd76e,
        0 12px 0 rgba(212, 197, 249, 0.7),
        0 22px 30px rgba(255, 143, 177, 0.35);
      transform: rotate(-2deg);
      animation: title-bounce 3s ease-in-out infinite;
    }

    @keyframes title-bounce {
      0%, 100% { transform: rotate(-2deg) translateY(0); }
      50% { transform: rotate(-2deg) translateY(-6px); }
    }

    /* 타이틀 옆 반짝이 별 */
    .menu-title-wrap::before,
    .menu-title-wrap::after {
      content: "✨";
      position: absolute;
      font-size: clamp(28px, 4vw, 48px);
      animation: sparkle 2s ease-in-out infinite;
    }

    .menu-title-wrap::before {
      top: 5%;
      left: 8%;
      animation-delay: 0s;
    }

    .menu-title-wrap::after {
      content: "💖";
      top: 10%;
      right: 8%;
      animation-delay: 1s;
    }

    @keyframes sparkle {
      0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.9; }
      50% { transform: scale(1.25) rotate(15deg); opacity: 1; }
    }

    .menu-subtitle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      margin-top: 22px;
      padding: 8px 22px;
      border-radius: 999px;
      color: #fff;
      background: linear-gradient(135deg, #ff8fb1, #d4c5f9);
      border: 3px solid #fff;
      box-shadow: 0 6px 0 rgba(255, 143, 177, 0.35), 0 12px 22px rgba(255, 143, 177, 0.25);
      font-weight: 900;
      font-size: clamp(13px, 1.7vw, 18px);
      letter-spacing: 0.3px;
    }

    .game-choice {
      position: relative;
      overflow: hidden;
      min-height: 440px;
      border-radius: 36px;
      padding: clamp(18px, 3vw, 30px);
      border: 4px solid #fff;
      box-shadow:
        0 10px 0 rgba(255, 143, 177, 0.18),
        0 24px 50px rgba(255, 143, 177, 0.28);
      isolation: isolate;
      display: grid;
      grid-template-rows: 1fr auto;
      align-content: center;
      text-align: center;
      transition: transform 200ms cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 200ms ease, filter 200ms ease;
      cursor: pointer;
      z-index: 1;
    }

    .game-choice:hover {
      transform: translateY(-8px) scale(1.015) rotate(-0.5deg);
      filter: saturate(1.1);
      box-shadow:
        0 16px 0 rgba(255, 143, 177, 0.22),
        0 36px 64px rgba(255, 143, 177, 0.35);
    }

    .game-choice:active {
      transform: translateY(-2px) scale(0.99);
    }

    .game-choice::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background-size: cover;
      background-position: center;
    }

    .game-choice::after {
      content: "";
      position: absolute;
      inset: auto -12% -18% -12%;
      height: 50%;
      z-index: -1;
      background: rgba(255, 255, 255, 0.8);
      transform: rotate(-3deg);
      border-top: 3px solid rgba(255, 143, 177, 0.15);
    }

    .choice-catch::before {
      background-image:
        linear-gradient(180deg, rgba(255, 245, 248, 0.4), rgba(255, 215, 110, 0.35)),
        url("assets/catch-background.png");
    }

    .choice-dodge::before {
      background-image:
        linear-gradient(180deg, rgba(245, 250, 255, 0.4), rgba(212, 197, 249, 0.35)),
        url("assets/dodge-background.png");
    }

    .choice-art {
      position: relative;
      height: min(45vh, 360px);
      min-height: 210px;
      pointer-events: none;
      display: grid;
      place-items: center;
      margin-top: clamp(14px, 3vh, 34px);
    }

    .menu-sprite {
      position: absolute;
      object-fit: contain;
      filter: drop-shadow(0 12px 16px rgba(255, 143, 177, 0.3));
      user-select: none;
    }

    .sprite-basket {
      width: min(42vw, 300px);
      max-height: 86%;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      animation: bob-gentle 3s ease-in-out infinite;
    }

    .sprite-chicken {
      width: min(18vw, 142px);
      top: 9%;
      left: 18%;
      transform: rotate(-18deg);
      z-index: 1;
      animation: drift-left 4s ease-in-out infinite;
    }

    .sprite-gold {
      width: min(16vw, 126px);
      top: 7%;
      right: 18%;
      transform: rotate(13deg);
      z-index: 1;
      animation: drift-right 4.5s ease-in-out infinite;
    }

    .sprite-man {
      height: min(42vh, 330px);
      max-width: 38%;
      bottom: 0;
      left: 42%;
      transform: translateX(-50%);
      z-index: 2;
      animation: bob-gentle 3.5s ease-in-out infinite;
    }

    .sprite-dog {
      width: min(26vw, 230px);
      right: 8%;
      top: 8%;
      transform: rotate(-10deg);
      z-index: 3;
      animation: drift-right 3.8s ease-in-out infinite;
    }

    @keyframes bob-gentle {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-10px); }
    }

    @keyframes drift-left {
      0%, 100% { transform: rotate(-18deg) translateY(0); }
      50% { transform: rotate(-22deg) translateY(-14px); }
    }

    @keyframes drift-right {
      0%, 100% { transform: rotate(13deg) translateY(0); }
      50% { transform: rotate(17deg) translateY(-14px); }
    }

    .game-choice h2 {
      margin: 0 0 8px;
      font-size: clamp(26px, 3.7vw, 50px);
      letter-spacing: -1px;
      line-height: 1.05;
      color: #fff;
      -webkit-text-stroke: 2px var(--ink);
      text-shadow:
        0 3px 0 #ffb8d0,
        0 6px 0 rgba(212, 197, 249, 0.6),
        0 12px 18px rgba(255, 143, 177, 0.3);
    }

    .game-choice p {
      margin: 0 auto 18px;
      max-width: 560px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.55;
      background: rgba(255, 255, 255, 0.7);
      padding: 8px 14px;
      border-radius: 16px;
      backdrop-filter: blur(6px);
    }

    .choice-copy {
      position: relative;
      z-index: 2;
      display: grid;
      justify-items: center;
    }

    .choice-start {
      width: min(220px, 100%);
      height: 56px;
      border-radius: 999px;
      color: #fff;
      font-weight: 900;
      font-size: 20px;
      letter-spacing: 1px;
      background: linear-gradient(180deg, #ffa3c1, #ff8fb1);
      border: 3px solid #fff;
      box-shadow:
        0 6px 0 rgba(255, 143, 177, 0.5),
        0 14px 24px rgba(255, 143, 177, 0.35);
      display: inline-grid;
      place-items: center;
      transition: transform 150ms ease, box-shadow 150ms ease;
    }

    .game-choice:hover .choice-start {
      transform: scale(1.05);
      box-shadow:
        0 8px 0 rgba(255, 143, 177, 0.55),
        0 18px 28px rgba(255, 143, 177, 0.4);
    }

    .choice-dodge .choice-start {
      background: linear-gradient(180deg, #c6b5f5, #a78ee5);
      box-shadow:
        0 6px 0 rgba(167, 142, 229, 0.5),
        0 14px 24px rgba(167, 142, 229, 0.35);
    }

    .game-choice.choice-dodge:hover .choice-start {
      box-shadow:
        0 8px 0 rgba(167, 142, 229, 0.55),
        0 18px 28px rgba(167, 142, 229, 0.4);
    }

    .hud {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      pointer-events: none;
    }

    .hud-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-width: 0;
    }

    .pill {
      min-width: 88px;
      height: 40px;
      padding: 0 12px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-weight: 900;
      background: rgba(255, 253, 248, 0.9);
      border: 1px solid var(--line);
      box-shadow: 0 8px 18px rgba(37, 27, 24, 0.09);
      backdrop-filter: blur(10px);
      white-space: nowrap;
    }

    .game-stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
      cursor: none;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .overlay {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 7;
      place-items: center;
      padding: 18px;
      background: rgba(37, 27, 24, 0.34);
      backdrop-filter: blur(8px);
    }

    .overlay.show {
      display: grid;
    }

    .dialog {
      width: min(520px, 100%);
      border-radius: 8px;
      padding: 24px;
      background: #fffdf8;
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: var(--shadow);
      text-align: center;
    }

    .dialog h2 {
      margin: 0 0 8px;
      font-size: clamp(28px, 5vw, 42px);
      line-height: 1.08;
    }

    .result-score {
      margin: 12px 0 18px;
      font-size: clamp(34px, 7vw, 64px);
      font-weight: 1000;
      color: var(--accent);
      line-height: 1;
    }

    .name-row {
      display: flex;
      gap: 8px;
      margin: 16px 0 12px;
    }

    .name-row input {
      min-width: 0;
      flex: 1;
      height: 44px;
      padding: 0 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      font: inherit;
      font-weight: 800;
      background: #fff8ee;
    }

    .dialog-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
    }

    .records-list {
      display: grid;
      gap: 8px;
      margin: 18px 0;
      text-align: left;
      max-height: min(48vh, 360px);
      overflow: auto;
    }

    .pause-mark {
      margin: 0 auto 12px;
      width: 76px;
      height: 76px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fffdf8;
      background: var(--ink);
      font-size: 38px;
      font-weight: 1000;
      box-shadow: 0 12px 25px rgba(37, 27, 24, 0.18);
    }

    .record-row {
      display: grid;
      grid-template-columns: 34px 1fr auto auto;
      align-items: center;
      gap: 10px;
      min-height: 42px;
      padding: 8px 10px;
      border-radius: 8px;
      background: #fff8ee;
      border: 1px solid var(--line);
      font-weight: 900;
    }

    .record-row small {
      color: rgba(37, 27, 24, 0.54);
      font-weight: 800;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 780px) {
      body {
        overflow: auto;
      }

      .app {
        min-height: 100vh;
        height: auto;
      }

      .topbar {
        min-height: 66px;
        align-items: flex-start;
      }

      h1 {
        white-space: normal;
      }

      .brand {
        display: none;
      }

      .top-actions {
        align-self: flex-end;
      }

      .menu {
        grid-template-columns: 1fr;
        padding-top: 132px;
      }

      .game-choice {
        min-height: 360px;
      }

      .choice-art {
        height: 240px;
        margin-top: 4px;
      }

      .sprite-basket {
        width: min(70vw, 250px);
      }

      .sprite-chicken,
      .sprite-gold {
        width: min(28vw, 105px);
      }

      .sprite-man {
        height: 220px;
        max-width: 42%;
      }

      .sprite-dog {
        width: min(38vw, 150px);
      }

      .screen.active:not(#menuScreen) {
        height: calc(100vh - 103px);
        min-height: 560px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <h1>가현이랑 놀자~</h1>
        <span id="subtitle">기록 게임</span>
      </div>
      <div class="top-actions">
        <button class="icon-button" id="homeBtn" title="처음으로" aria-label="처음으로">⌂</button>
        <button class="ghost-button" id="recordsBtn">기록</button>
      </div>
    </header>

    <section class="screen active" id="menuScreen">
      <div class="menu">
        <div class="menu-title-wrap">
          <h1 class="menu-title">가현이랑 놀자~</h1>
          <div class="menu-subtitle">10초 치킨 러시 · 무한 피하기 챌린지</div>
        </div>
        <button class="game-choice choice-catch" data-start="catch">
          <div class="choice-art">
            <img class="menu-sprite sprite-chicken" src="assets/chicken.png" alt="">
            <img class="menu-sprite sprite-gold" src="assets/golden-chicken.png" alt="">
            <img class="menu-sprite sprite-basket" src="assets/basket.png" alt="">
          </div>
          <div class="choice-copy">
            <h2>교촌치킨 받기</h2>
            <p>치와와 가현이가 던지는 치킨을 바구니로 받아요. 일반 치킨은 1점, 금색 치킨은 5점입니다.</p>
            <span class="choice-start">시작</span>
          </div>
        </button>
        <button class="game-choice choice-dodge" data-start="dodge">
          <div class="choice-art">
            <img class="menu-sprite sprite-man" src="assets/man.png" alt="">
            <img class="menu-sprite sprite-dog" src="assets/chihuahua-1.png" alt="">
          </div>
          <div class="choice-copy">
            <h2>가현이피하기</h2>
            <p>남자 캐릭터를 마우스로 움직여 날아오는 치와와를 피해요. 부딪히면 바로 끝나고, 오래 버틸수록 기록이 올라갑니다.</p>
            <span class="choice-start">시작</span>
          </div>
        </button>
      </div>
    </section>

    <section class="screen" id="gameScreen">
      <div class="hud">
        <div class="hud-group">
          <div class="pill">⏱ <span id="timeText">30.0</span></div>
          <div class="pill"><span id="scoreLabel">점수</span> <span id="scoreText">0</span></div>
          <div class="pill">최고 <span id="bestText">0</span></div>
        </div>
        <div class="hud-group">
          <div class="pill" id="gameNameText">게임</div>
        </div>
      </div>
      <div class="game-stage" id="gameStage">
        <canvas id="gameCanvas"></canvas>
      </div>
    </section>
  </main>

  <div class="overlay" id="resultOverlay">
    <div class="dialog">
      <h2 id="resultTitle">기록!</h2>
      <div class="result-score"><span id="resultScore">0</span><span id="resultUnit">점</span></div>
      <p id="resultMessage">이름을 남기면 기록에 저장됩니다.</p>
      <div class="name-row">
        <input id="playerNameInput" maxlength="12" placeholder="이름">
        <button class="primary-button" id="saveScoreBtn">저장</button>
      </div>
      <div class="dialog-actions">
        <button class="ghost-button" id="retryBtn">다시하기</button>
        <button class="ghost-button" id="menuBtn">메뉴</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="recordsOverlay">
    <div class="dialog">
      <h2>기록</h2>
      <div class="records-list" id="recordsList"></div>
      <div class="dialog-actions">
        <button class="ghost-button" id="clearLocalBtn">새로고침</button>
        <button class="primary-button" id="closeRecordsBtn">닫기</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="pauseOverlay">
    <div class="dialog">
      <div class="pause-mark">Ⅱ</div>
      <h2>일시정지</h2>
      <p>Esc를 다시 누르면 이어서 시작합니다.</p>
      <div class="dialog-actions">
        <button class="primary-button" id="resumeBtn">계속하기</button>
        <button class="ghost-button" id="pauseMenuBtn">메뉴</button>
      </div>
    </div>
  </div>

  <script type="module">
    /*
      이미지 교체 방법:
      같은 폴더에 assets 폴더를 만들고 아래 파일명을 넣으면 자동으로 사용합니다.
      assets/basket.png, assets/chicken.png, assets/golden-chicken.png,
      assets/catch-background.png, assets/dodge-background.png,
      assets/chihuahua-1.png, assets/chihuahua-2.png, assets/chihuahua-3.png,
      assets/man.png

      Firebase 사용 방법:
      아래 firebaseConfig 값을 본인 프로젝트 값으로 바꾸고,
      Realtime Database의 rules를 적절히 설정하면 기록 저장을 Firebase에도 보냅니다.
    */

    // ▼▼▼ Firebase 설정: 콘솔의 프로젝트 설정 → 내 앱 → SDK 설정에서 복사한 값 그대로 붙여넣기 ▼▼▼
    const firebaseConfig = {
      apiKey: "AIzaSyAI4ZOhUX4ZIqqH9CFbw_ngZnenS9Qv_h8",
      authDomain: "play-with-gahyun.firebaseapp.com",
      databaseURL: "https://play-with-gahyun-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "play-with-gahyun",
      storageBucket: "play-with-gahyun.firebasestorage.app",
      messagingSenderId: "388459290421",
      appId: "1:388459290421:web:f41c55f76aacb92eb2f67c"
    };
    // ▲▲▲ Firebase 설정 끝 ▲▲▲

    // Firebase는 처음 한 번만 초기화하고, db 핸들을 캐싱해서 재사용
    let firebaseDbPromise = null;
    function getFirebaseDb() {
      if (!firebaseConfig.apiKey) return null;
      if (!firebaseDbPromise) {
        firebaseDbPromise = (async () => {
          const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
          const dbMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js");
          const app = initializeApp(firebaseConfig);
          return { db: dbMod.getDatabase(app), ...dbMod };
        })();
      }
      return firebaseDbPromise;
    }

    const CATCH_GAME_SECONDS = 10;
    const ASSETS = {
      basket: "assets/basket.png",
      chicken: "assets/chicken.png",
      goldenChicken: "assets/golden-chicken.png",
      catchBackground: "assets/catch-background.png",
      dodgeBackground: "assets/dodge-background.png",
      chihuahua1: "assets/chihuahua-1.png",
      chihuahua2: "assets/chihuahua-2.png",
      chihuahua3: "assets/chihuahua-3.png",
      man: "assets/man.png"
    };

    const $ = (selector) => document.querySelector(selector);
    const canvas = $("#gameCanvas");
    const ctx = canvas.getContext("2d");
    const menuScreen = $("#menuScreen");
    const gameScreen = $("#gameScreen");
    const resultOverlay = $("#resultOverlay");
    const recordsOverlay = $("#recordsOverlay");
    const pauseOverlay = $("#pauseOverlay");

    const state = {
      mode: null,
      running: false,
      paused: false,
      score: 0,
      best: 0,
      timeLeft: CATCH_GAME_SECONDS,
      lastTime: 0,
      spawnTimer: 0,
      pointer: { x: 0, y: 0, active: false },
      player: { x: 0, y: 0, w: 74, h: 92 },
      items: [],
      savedCurrentScore: false
    };

    const imageStore = {};

    function loadImage(key, src) {
      const img = new Image();
      img.src = src;
      imageStore[key] = img;
    }

    Object.entries(ASSETS).forEach(([key, src]) => loadImage(key, src));

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      canvas.width = Math.floor(rect.width * dpr);
      canvas.height = Math.floor(rect.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (!state.pointer.active) {
        state.pointer.x = rect.width / 2;
        state.pointer.y = rect.height * 0.78;
      }
    }

    function showScreen(name) {
      menuScreen.classList.toggle("active", name === "menu");
      gameScreen.classList.toggle("active", name === "game");
      $("#subtitle").textContent = name === "menu" ? "기록 게임" : "마우스로 움직이기";
      if (name === "game") {
        requestAnimationFrame(resizeCanvas);
      }
    }

    // 온라인 기록만 사용. 게임 시작 시 최고기록 표시용으로 한 번 가져와서 캐싱.
    let onlineRecordsCache = null;
    async function refreshRecordsCache() {
      onlineRecordsCache = await fetchFirebaseRecords();
      return onlineRecordsCache;
    }

    function gameLabel(mode) {
      return mode === "catch" ? "교촌치킨 받기" : "가현이피하기";
    }

    function isDodgeMode(mode = state.mode) {
      return mode === "dodge";
    }

    function formatRecordValue(value, mode = state.mode) {
      return isDodgeMode(mode) ? Number(value).toFixed(1) : String(Math.floor(value));
    }

    function recordUnit(mode = state.mode) {
      return isDodgeMode(mode) ? "초" : "점";
    }

    function getBestFromCache(mode) {
      if (!onlineRecordsCache) return 0;
      return onlineRecordsCache
        .filter((record) => record.mode === mode)
        .reduce((best, record) => Math.max(best, record.score), 0);
    }

    async function saveScoreToFirebase(record) {
      const handle = await getFirebaseDb();
      if (!handle) return false;
      const { db, ref, push, serverTimestamp } = handle;
      await push(ref(db, "gameRecords"), {
        ...record,
        createdAt: serverTimestamp()
      });
      return true;
    }

    // Firebase에서 상위 기록을 가져옴 (score 내림차순 상위 50개)
    async function fetchFirebaseRecords() {
      const handle = await getFirebaseDb();
      if (!handle) return [];
      const { db, ref, query, orderByChild, limitToLast, get } = handle;
      try {
        const snap = await get(query(ref(db, "gameRecords"), orderByChild("score"), limitToLast(50)));
        if (!snap.exists()) return [];
        const list = [];
        snap.forEach((child) => {
          const val = child.val();
          list.push({ ...val, _source: "online" });
        });
        return list;
      } catch (error) {
        console.warn("Firebase 기록 불러오기 실패:", error);
        return [];
      }
    }

    async function saveScore() {
      if (state.savedCurrentScore) return;
      const name = $("#playerNameInput").value.trim() || "이름없음";
      const record = {
        name,
        score: state.score,
        mode: state.mode,
        game: gameLabel(state.mode),
        date: new Date().toISOString()
      };

      $("#saveScoreBtn").textContent = "저장 중...";
      $("#saveScoreBtn").disabled = true;

      try {
        const firebaseSaved = await saveScoreToFirebase(record);
        if (firebaseSaved) {
          state.savedCurrentScore = true;
          $("#saveScoreBtn").textContent = "저장됨";
          $("#resultMessage").textContent = "온라인 기록에 저장됐습니다.";
          // 캐시 갱신
          await refreshRecordsCache();
        } else {
          $("#saveScoreBtn").textContent = "저장";
          $("#saveScoreBtn").disabled = false;
          $("#resultMessage").textContent = "Firebase 설정이 필요합니다. 저장할 수 없습니다.";
        }
      } catch (error) {
        console.error("저장 실패:", error);
        $("#saveScoreBtn").textContent = "다시 시도";
        $("#saveScoreBtn").disabled = false;
        $("#resultMessage").textContent = "저장 실패: 네트워크 또는 권한을 확인하세요.";
      }
    }

    function startGame(mode) {
      state.mode = mode;
      state.running = true;
      state.paused = false;
      state.score = 0;
      state.best = getBestFromCache(mode);
      state.timeLeft = isDodgeMode(mode) ? 0 : CATCH_GAME_SECONDS;
      state.lastTime = 0;
      state.spawnTimer = 0;
      state.items = [];
      state.savedCurrentScore = false;
      state.pointer.active = false;
      $("#scoreLabel").textContent = isDodgeMode(mode) ? "기록" : "점수";
      $("#scoreText").textContent = formatRecordValue(0, mode);
      $("#bestText").textContent = formatRecordValue(state.best, mode) + recordUnit(mode);
      $("#timeText").textContent = isDodgeMode(mode) ? "0.0" : CATCH_GAME_SECONDS.toFixed(1);
      $("#gameNameText").textContent = gameLabel(mode);
      $("#saveScoreBtn").textContent = "저장";
      $("#saveScoreBtn").disabled = false;
      resultOverlay.classList.remove("show");
      pauseOverlay.classList.remove("show");
      showScreen("game");
      resizeCanvas();
      requestAnimationFrame(loop);
    }

    function endGame() {
      state.running = false;
      state.paused = false;
      pauseOverlay.classList.remove("show");
      const isBest = state.score > state.best;
      $("#resultTitle").textContent = isBest ? "신기록!" : "게임 끝!";
      $("#resultScore").textContent = formatRecordValue(state.score);
      $("#resultUnit").textContent = recordUnit();
      $("#resultMessage").textContent = isBest ? "좋아요. 이름을 남겨 기록을 갱신해요." : "이름을 남기면 기록에 저장됩니다.";
      resultOverlay.classList.add("show");
    }

    function setPaused(paused) {
      if (!state.running || menuScreen.classList.contains("active")) return;
      state.paused = paused;
      pauseOverlay.classList.toggle("show", paused);
      if (!paused) {
        state.lastTime = 0;
        requestAnimationFrame(loop);
      }
    }

    function togglePause() {
      setPaused(!state.paused);
    }

    function updateHud() {
      $("#scoreText").textContent = formatRecordValue(state.score);
      $("#timeText").textContent = Math.max(0, state.timeLeft).toFixed(1);
    }

    function random(min, max) {
      return min + Math.random() * (max - min);
    }

    function spawnCatchItem(width) {
      const gold = Math.random() < 0.13;
      state.items.push({
        type: gold ? "gold" : "chicken",
        x: random(42, width - 42),
        y: -40,
        r: gold ? 27 : 23,
        vx: random(-70, 70),
        vy: random(440, 720),
        spin: random(-4, 4),
        angle: random(0, Math.PI * 2),
        score: gold ? 5 : 1
      });
    }

    function spawnDodgeItem(width, height) {
      const side = Math.floor(random(0, 4));
      const difficulty = Math.min(1, state.timeLeft / 45);
      const speed = random(190, 330) + state.timeLeft * 18 + difficulty * 140;
      let x;
      let y;
      if (side === 0) {
        x = random(0, width);
        y = -50;
      } else if (side === 1) {
        x = width + 50;
        y = random(0, height);
      } else if (side === 2) {
        x = random(0, width);
        y = height + 50;
      } else {
        x = -50;
        y = random(0, height);
      }
      const dx = state.player.x - x;
      const dy = state.player.y - y;
      const distance = Math.hypot(dx, dy) || 1;
      const vx = (dx / distance) * speed + random(-45, 45);
      const vy = (dy / distance) * speed + random(-45, 45);
      state.items.push({
        type: "chihuahua",
        x,
        y,
        r: random(25, 36),
        vx,
        vy,
        angle: random(0, Math.PI * 2),
        spin: random(-5, 5),
        flipX: vx < 0
      });
    }

    function drawFallback(kind, x, y, size, angle = 0) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = `${size}px "Segoe UI Emoji", "Apple Color Emoji", sans-serif`;
      const emoji = {
        basket: "🧺",
        chicken: "🍗",
        goldenChicken: "🍗",
        chihuahua1: "🐶",
        chihuahua2: "🐶",
        chihuahua3: "🐶",
        man: "🏃‍♂️"
      }[kind];
      if (kind === "goldenChicken") {
        ctx.beginPath();
        ctx.arc(0, 0, size * 0.52, 0, Math.PI * 2);
        ctx.fillStyle = "#ffd43b";
        ctx.fill();
      }
      ctx.fillText(emoji, 0, 0);
      ctx.restore();
    }

    function drawImageOrFallback(key, x, y, w, h, angle = 0, flipX = false) {
      const img = imageStore[key];
      if (img && img.complete && img.naturalWidth > 0) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.scale(flipX ? -1 : 1, 1);
        ctx.drawImage(img, -w / 2, -h / 2, w, h);
        ctx.restore();
      } else {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(flipX ? -1 : 1, 1);
        ctx.translate(-x, -y);
        drawFallback(key, x, y, Math.max(w, h) * 0.72, angle);
        ctx.restore();
      }
    }

    function currentChihuahuaFrame(offset = 0) {
      const frame = Math.floor((performance.now() / 105 + offset) % 3);
      return ["chihuahua1", "chihuahua2", "chihuahua3"][frame];
    }

    function drawChihuahua(x, y, w, h, angle = 0, offset = 0, flipX = false) {
      drawImageOrFallback(currentChihuahuaFrame(offset), x, y, w, h, angle, flipX);
    }

    function drawGoldenChicken(x, y, w, h, angle = 0) {
      ctx.save();
      ctx.translate(x, y);
      const radius = Math.max(w, h) * 0.42;
      const glow = ctx.createRadialGradient(0, 0, radius * 0.1, 0, 0, radius);
      glow.addColorStop(0, "rgba(255, 238, 113, 0.95)");
      glow.addColorStop(1, "rgba(255, 190, 47, 0)");
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      drawImageOrFallback("goldenChicken", x, y, w, h, angle);
    }

    function drawCoverImage(key, width, height) {
      const img = imageStore[key];
      if (!img || !img.complete || img.naturalWidth <= 0) return false;
      const imageRatio = img.naturalWidth / img.naturalHeight;
      const canvasRatio = width / height;
      let drawW = width;
      let drawH = height;
      let drawX = 0;
      let drawY = 0;
      if (imageRatio > canvasRatio) {
        drawH = height;
        drawW = height * imageRatio;
        drawX = (width - drawW) / 2;
      } else {
        drawW = width;
        drawH = width / imageRatio;
        drawY = (height - drawH) / 2;
      }
      ctx.drawImage(img, drawX, drawY, drawW, drawH);
      return true;
    }

    function drawBackground(width, height) {
      ctx.clearRect(0, 0, width, height);
      const backgroundKey = state.mode === "catch" ? "catchBackground" : "dodgeBackground";
      if (drawCoverImage(backgroundKey, width, height)) {
        return;
      }
      const gradient = ctx.createLinearGradient(0, 0, width, height);
      if (state.mode === "catch") {
        gradient.addColorStop(0, "#fff0d1");
        gradient.addColorStop(0.56, "#ffe0b8");
        gradient.addColorStop(1, "#e9f8ff");
      } else {
        gradient.addColorStop(0, "#e9f8ff");
        gradient.addColorStop(0.52, "#f7ffe9");
        gradient.addColorStop(1, "#fff0d1");
      }
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, width, height);

      ctx.fillStyle = "rgba(255, 255, 255, 0.48)";
      for (let i = 0; i < 9; i++) {
        const x = ((i * 173) % Math.max(width, 1)) + 10;
        const y = ((i * 97) % Math.max(height, 1)) + 20;
        ctx.beginPath();
        ctx.arc(x, y, 28 + (i % 3) * 14, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = state.mode === "catch" ? "rgba(228, 65, 47, 0.13)" : "rgba(27, 167, 132, 0.13)";
      ctx.fillRect(0, height - 54, width, 54);
    }

    function updateCatch(dt, width, height) {
      state.spawnTimer -= dt;
      if (state.spawnTimer <= 0) {
        spawnCatchItem(width);
        state.spawnTimer = random(0.16, 0.34);
      }

      const basketW = Math.min(132, Math.max(92, width * 0.16));
      const basketH = basketW * 0.62;
      state.player.x = Math.min(width - basketW / 2, Math.max(basketW / 2, state.pointer.x || width / 2));
      state.player.y = height - 76;
      state.player.w = basketW;
      state.player.h = basketH;

      state.items.forEach((item) => {
        item.x += item.vx * dt;
        item.y += item.vy * dt;
        item.angle += item.spin * dt;
        if (item.x < item.r || item.x > width - item.r) item.vx *= -0.7;
      });

      state.items = state.items.filter((item) => {
        const caught =
          item.y + item.r > state.player.y - basketH * 0.3 &&
          item.y < state.player.y + basketH * 0.35 &&
          item.x > state.player.x - basketW * 0.48 &&
          item.x < state.player.x + basketW * 0.48;
        if (caught) {
          state.score += item.score;
          return false;
        }
        return item.y < height + 80;
      });
    }

    function updateDodge(dt, width, height) {
      const size = Math.min(88, Math.max(62, width * 0.1));
      const targetX = state.pointer.active ? state.pointer.x : width / 2;
      const targetY = state.pointer.active ? state.pointer.y : height / 2;
      state.player.x += (targetX - state.player.x) * Math.min(1, dt * 14);
      state.player.y += (targetY - state.player.y) * Math.min(1, dt * 14);
      state.player.x = Math.min(width - size / 2, Math.max(size / 2, state.player.x || width / 2));
      state.player.y = Math.min(height - size / 2, Math.max(size / 2, state.player.y || height / 2));
      state.player.w = size;
      state.player.h = size;

      state.spawnTimer -= dt;
      if (state.spawnTimer <= 0) {
        spawnDodgeItem(width, height);
        state.spawnTimer = Math.max(0.12, random(0.46, 0.82) - state.timeLeft * 0.018);
      }

      state.score = Math.max(state.score, Math.floor(state.timeLeft * 10) / 10);

      let hit = false;
      state.items.forEach((item) => {
        item.x += item.vx * dt;
        item.y += item.vy * dt;
        item.angle += item.spin * dt;
        const distance = Math.hypot(item.x - state.player.x, item.y - state.player.y);
        if (distance < item.r + size * 0.32) hit = true;
      });

      state.items = state.items.filter((item) => (
        item.x > -110 && item.x < width + 110 && item.y > -110 && item.y < height + 110
      ));

      if (hit) {
        endGame();
        return false;
      }

      return true;
    }

    function drawCatch(width, height) {
      drawBackground(width, height);
      drawChihuahua(width / 2, 88, 116, 96, Math.sin(performance.now() / 240) * 0.08);
      ctx.fillStyle = "rgba(37, 27, 24, 0.18)";
      ctx.beginPath();
      ctx.ellipse(width / 2, 142, 58, 12, 0, 0, Math.PI * 2);
      ctx.fill();

      state.items.forEach((item) => {
        if (item.type === "gold") {
          drawGoldenChicken(item.x, item.y, item.r * 2.35, item.r * 2.35, item.angle);
        } else {
          drawImageOrFallback("chicken", item.x, item.y, item.r * 2.2, item.r * 2.2, item.angle);
        }
      });

      drawImageOrFallback("basket", state.player.x, state.player.y, state.player.w, state.player.h, 0);
    }

    function drawDodge(width, height) {
      drawBackground(width, height);
      state.items.forEach((item, index) => {
        drawChihuahua(item.x, item.y, item.r * 2.7, item.r * 2.25, item.angle, index, item.flipX);
      });

      ctx.fillStyle = "rgba(37, 27, 24, 0.14)";
      ctx.beginPath();
      ctx.ellipse(state.player.x, state.player.y + state.player.h * 0.38, state.player.w * 0.34, 9, 0, 0, Math.PI * 2);
      ctx.fill();
      drawImageOrFallback("man", state.player.x, state.player.y, state.player.w, state.player.h, 0);
    }

    function loop(timestamp) {
      if (!state.running) return;
      if (state.paused) return;
      if (!state.lastTime) state.lastTime = timestamp;
      const dt = Math.min(0.033, (timestamp - state.lastTime) / 1000);
      state.lastTime = timestamp;

      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      state.timeLeft += isDodgeMode() ? dt : -dt;

      if (state.mode === "catch") {
        updateCatch(dt, width, height);
        drawCatch(width, height);
      } else {
        const alive = updateDodge(dt, width, height);
        drawDodge(width, height);
        updateHud();
        if (!alive) return;
      }

      updateHud();
      if (!isDodgeMode() && state.timeLeft <= 0) {
        state.timeLeft = 0;
        updateHud();
        endGame();
        return;
      }
      requestAnimationFrame(loop);
    }

    function updatePointer(event) {
      const rect = canvas.getBoundingClientRect();
      state.pointer.x = event.clientX - rect.left;
      state.pointer.y = event.clientY - rect.top;
      state.pointer.active = true;
    }

    async function renderRecords() {
      const list = $("#recordsList");
      list.innerHTML = "<div class=\"record-row\"><span>...</span><span>불러오는 중</span><small></small><small></small></div>";

      const records = await fetchFirebaseRecords();
      onlineRecordsCache = records;

      records.sort((a, b) => b.score - a.score);

      list.innerHTML = "";
      if (!records.length) {
        list.innerHTML = "<div class=\"record-row\"><span>!</span><span>아직 기록이 없습니다</span><small></small><small></small></div>";
        return;
      }

      records.slice(0, 20).forEach((record, index) => {
        const row = document.createElement("div");
        row.className = "record-row";
        const date = new Date(record.date);
        row.innerHTML = `
          <span>${index + 1}</span>
          <span>${escapeHtml(record.name)}</span>
          <small>${escapeHtml(record.game || gameLabel(record.mode))}</small>
          <strong>${formatRecordValue(record.score, record.mode)}${recordUnit(record.mode)}</strong>
        `;
        row.title = Number.isNaN(date.getTime()) ? "" : date.toLocaleString();
        list.appendChild(row);
      });
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll("\"", "&quot;")
        .replaceAll("'", "&#039;");
    }

    document.querySelectorAll("[data-start]").forEach((button) => {
      button.addEventListener("click", () => startGame(button.dataset.start));
    });

    $("#homeBtn").addEventListener("click", () => {
      state.running = false;
      state.paused = false;
      resultOverlay.classList.remove("show");
      recordsOverlay.classList.remove("show");
      pauseOverlay.classList.remove("show");
      showScreen("menu");
    });

    $("#recordsBtn").addEventListener("click", () => {
      renderRecords();
      recordsOverlay.classList.add("show");
    });

    $("#closeRecordsBtn").addEventListener("click", () => recordsOverlay.classList.remove("show"));
    $("#menuBtn").addEventListener("click", () => {
      resultOverlay.classList.remove("show");
      showScreen("menu");
    });
    $("#resumeBtn").addEventListener("click", () => setPaused(false));
    $("#pauseMenuBtn").addEventListener("click", () => {
      state.running = false;
      state.paused = false;
      pauseOverlay.classList.remove("show");
      showScreen("menu");
    });
    $("#retryBtn").addEventListener("click", () => startGame(state.mode || "catch"));
    $("#saveScoreBtn").addEventListener("click", async () => {
      await saveScore();
    });
    $("#clearLocalBtn").addEventListener("click", () => {
      renderRecords();
    });

    canvas.addEventListener("pointermove", updatePointer);
    canvas.addEventListener("pointerdown", updatePointer);
    window.addEventListener("resize", resizeCanvas);
    window.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && state.running) {
        event.preventDefault();
        togglePause();
      }
    });
    window.addEventListener("blur", () => {
      if (state.running) state.lastTime = 0;
    });

    resizeCanvas();

    // 페이지 로드 시 온라인 기록 미리 가져와서 캐싱 (최고기록 표시용)
    refreshRecordsCache().catch((err) => console.warn("초기 기록 로드 실패:", err));
  </script>
</body>
</html>
